<section class="em" aria-labelledby="em-title">
  <h2 id="em-title" data-i="emergency.title"></h2>
  <p class="em-warn" data-i="emergency.disclaimer"></p>
  <p><strong data-i="emergency.numbers"></strong>: <span id="em-nums"></span></p>
  <label class="em-check"><input type="checkbox" id="em-optin"> <span data-i="emergency.optin"></span></label>
  <div id="em-form">
    <label for="em-house" data-i="emergency.house"></label><select id="em-house"></select>
    <label for="em-kind" data-i="emergency.kind"></label><select id="em-kind"></select>
    <label for="em-note" data-i="emergency.note"></label><textarea id="em-note" maxlength="300" rows="2"></textarea>
    <div class="actions"><button id="em-raise" data-i="emergency.raise"></button></div>
  </div>
  <p id="em-status" role="status" aria-live="polite"></p>
  <h3 data-i="emergency.active"></h3>
  <ul id="em-list" class="em-list"></ul>
</section>
